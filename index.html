      :root {

      body {

        isolation: isolate;
        min-height: 100svh;
        overflow: hidden;
        padding: clamp(18px, 4vw, 44px) 16px 22px;
      }

      .ambient {
        position: absolute;
        z-index: -1;
        border-radius: 999px;

      }

        top: -95px;
        right: -80px;

        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 28px;
        background: rgba(255, 254, 251, 0.94);
        box-shadow: 0 24px 64px rgba(83, 63, 54, 0.13), 0 3px 12px rgba(83, 63, 54, 0.06);
        backdrop-filter: blur(10px);
      }

      .cover-frame {
        position: relative;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        background: var(--peach-soft);
      }

      .cover-frame::after {
        position: absolute;
        inset: auto 0 0;
        height: 22%;
        content: '';
        background: linear-gradient(to bottom, transparent, rgba(48, 39, 35, 0.08));
        pointer-events: none;

      .cover-image {

        width: 100%;
        height: 100%;
